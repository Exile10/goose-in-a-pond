<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News — MCP App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Quicksand', sans-serif; background: transparent; }
  .card { background: #fff; border-radius: 16px; border: 1px solid #EBEBF0; overflow: hidden; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .title { font-size: 13px; font-weight: 700; color: #18181B; }
  .date-chip { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #F1F5F9; color: #475569; }
  .divider { height: 1px; background: #F1F5F9; }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; cursor: pointer; }
  .row + .row { border-top: 1px solid #F8FAFC; }
  .tag { font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 999px; flex-shrink: 0; margin-top: 1px; letter-spacing: 0.2px; }
  .headline { flex: 1; font-size: 12px; font-weight: 600; color: #18181B; line-height: 1.45; }
  .time { font-size: 11px; color: #94A3B8; flex-shrink: 0; margin-top: 1px; font-weight: 500; }
  .chevron { color: #CBD5E1; flex-shrink: 0; margin-top: 1px; }
  .loading { padding: 40px; text-align: center; color: #94A3B8; font-size: 13px; }
</style>
</head>
<body>
<div id="root" class="card"><div class="loading">Loading headlines...</div></div>
<script src="mcp-bridge.js"></script>
<script>
  const root = document.getElementById('root');
  const app = new McpApp({ name: 'giap-news', version: '1.0.0' });

  const TAG_STYLES = {
    tech: { bg: '#EDE9FE', color: '#7C3AED' }, world: { bg: '#FEF9C3', color: '#92400E' },
    business: { bg: '#DCFCE7', color: '#15803D' }, health: { bg: '#CFFAFE', color: '#0E7490' },
    science: { bg: '#DBEAFE', color: '#1D4ED8' }, sports: { bg: '#FFE4E6', color: '#DC2626' },
    politics: { bg: '#FEF3C7', color: '#92400E' }, finance: { bg: '#DCFCE7', color: '#15803D' },
    entertainment: { bg: '#FCE7F3', color: '#BE185D' }, climate: { bg: '#CFFAFE', color: '#0E7490' },
  };
  const DEFAULT_TAG = { bg: '#F1F5F9', color: '#475569' };

  function render(data) {
    const items = data.items || data.headlines || [];
    const date = data.date || new Date().toLocaleDateString('en', { month: 'short', day: 'numeric' });
    const chevron = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="1.75" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>';

    let html = `<div class="header"><div class="header-left"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="1.75" stroke-linecap="round"><path d="M4 4h16v12H5.5L4 17.5z"/></svg><span class="title">Headlines</span></div><span class="date-chip">${date}</span></div><div class="divider"></div>`;

    items.slice(0, 6).forEach(it => {
      const s = TAG_STYLES[(it.tag||'').toLowerCase()] || DEFAULT_TAG;
      html += `<div class="row"><span class="tag" style="background:${s.bg};color:${s.color}">${it.tag||''}</span><span class="headline">${it.headline||''}</span><span class="time">${it.timeAgo||''}</span><span class="chevron">${chevron}</span></div>`;
    });

    root.innerHTML = html;
    app.reportSize(root.offsetWidth, root.offsetHeight);
  }

  app.ontoolresult = (result) => {
    const text = result?.content?.find(c => c.type === 'text')?.text;
    if (!text) return;
    try { render(JSON.parse(text)); } catch { /* ignore */ }
  };
  app.ontoolinput = (input) => { if (input?.arguments) render(input.arguments); };
  app.connect();
</script>
</body>
</html>
