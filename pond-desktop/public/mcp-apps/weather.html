<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather — MCP App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Quicksand', sans-serif; background: transparent; }
  .card { background: #fff; border-radius: 16px; border: 1px solid #EBEBF0; overflow: hidden; display: flex; flex-direction: column; }
  .hero { background: linear-gradient(150deg, #E0F2FE 0%, #BAE6FD 55%, #F0F9FF 100%); padding: 28px 20px 22px; display: flex; align-items: center; gap: 18px; }
  .temp { font-size: 54px; font-weight: 800; color: #0C4A6E; line-height: 1; letter-spacing: -2px; }
  .unit { font-size: 26px; font-weight: 600; letter-spacing: 0; }
  .cond { font-size: 15px; font-weight: 700; color: #0369A1; margin-top: 4px; }
  .loc  { font-size: 12px; color: #0EA5E9; margin-top: 2px; font-weight: 500; }
  .stats { padding: 12px 16px; display: flex; gap: 8px; border-bottom: 1px solid #F1F5F9; }
  .pill { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #475569; background: #F8FAFC; padding: 5px 11px; border-radius: 9px; border: 1px solid #E2E8F0; }
  .forecast { padding: 14px 16px 16px; display: flex; gap: 6px; flex: 1; }
  .fday { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 11px; background: #F8FAFC; border: 1px solid #F1F5F9; }
  .fday-label { font-size: 10px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; }
  .fday-hi { font-size: 13px; font-weight: 800; color: #1E293B; }
  .fday-lo { font-size: 11px; color: #94A3B8; font-weight: 500; }
  .loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 40px 0; }
  .loading span { font-size: 13px; color: #64748B; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 20px; height: 20px; border: 2px solid #BAE6FD; border-top-color: #0369A1; border-radius: 50%; animation: spin 1s linear infinite; }
</style>
</head>
<body>
<div id="root" class="card">
  <div class="hero loading"><div class="spinner"></div><span>Fetching weather...</span></div>
</div>
<script src="mcp-bridge.js"></script>
<script>
  const root = document.getElementById('root');
  const app = new McpApp({ name: 'giap-weather', version: '1.0.0' });

  function weatherSvg(cond, size) {
    const c = (cond || '').toLowerCase();
    if (c.includes('rain')) return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="19" x2="8" y2="21" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="19" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="19" x2="16" y2="21" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/></svg>`;
    if (c.includes('cloud') || c.includes('overcast')) return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h.79a4.5 4.5 0 1 1 1 9z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/></svg>`;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" fill="#FCD34D" stroke="#FBBF24" stroke-width="0.5"/><g stroke="#FBBF24" stroke-width="1.75" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></g></svg>`;
  }

  function render(d) {
    const temp = Math.round(d.temperature ?? d.temp ?? 0);
    const cond = d.condition ?? d.description ?? '';
    const loc = d.location ?? d.city ?? '';
    const humidity = d.humidity;
    const wind = d.wind_speed;
    const forecast = d.forecast ?? d.days ?? [];

    let html = `<div class="hero">${weatherSvg(cond, 56)}<div>`;
    html += `<div class="temp">${temp}<span class="unit">&deg;C</span></div>`;
    html += `<div class="cond">${cond || 'Unknown'}</div>`;
    html += `<div class="loc">${loc || 'Unknown'}</div></div></div>`;

    if (humidity != null || wind != null) {
      html += '<div class="stats">';
      if (humidity != null) html += `<span class="pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="1.75" stroke-linecap="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>${humidity}% humidity</span>`;
      if (wind != null) html += `<span class="pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="1.75" stroke-linecap="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2"/><path d="M12.59 19.41A2 2 0 1 0 14 16H2"/></svg>${Math.round(wind)} km/h wind</span>`;
      html += '</div>';
    }

    if (forecast.length > 0) {
      html += '<div class="forecast">';
      forecast.slice(0, 5).forEach(f => {
        const day = f.day || (f.date ? new Date(f.date).toLocaleDateString('en', {weekday:'short'}) : '');
        const c = f.cond ?? f.condition ?? f.description ?? '';
        const hi = f.hi ?? f.temp_max_c;
        const lo = f.lo ?? f.temp_min_c;
        html += `<div class="fday"><span class="fday-label">${day}</span>${weatherSvg(c, 18)}`;
        if (hi != null) html += `<span class="fday-hi">${Math.round(hi)}&deg;</span>`;
        if (lo != null) html += `<span class="fday-lo">${Math.round(lo)}&deg;</span>`;
        html += '</div>';
      });
      html += '</div>';
    }

    root.innerHTML = html;
    app.reportSize(root.offsetWidth, root.offsetHeight);
  }

  app.ontoolresult = (result) => {
    const text = result?.content?.find(c => c.type === 'text')?.text;
    if (!text) return;
    try { render(JSON.parse(text)); } catch { render({ condition: text }); }
  };

  app.ontoolinput = (input) => {
    if (input?.arguments) render(input.arguments);
  };

  app.connect();
</script>
</body>
</html>
