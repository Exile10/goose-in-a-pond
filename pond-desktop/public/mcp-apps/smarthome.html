<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Home — MCP App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Quicksand', sans-serif; background: transparent; }
  .card { background: #fff; border-radius: 16px; border: 1px solid #EBEBF0; overflow: hidden; display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .title { font-size: 13px; font-weight: 700; color: #18181B; }
  .secure { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #F0FDF4; color: #166534; }
  .meta { padding: 0 16px 10px; font-size: 12px; color: #94A3B8; font-weight: 600; }
  .rooms { padding: 0 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .room { padding: 11px 12px; border-radius: 12px; cursor: pointer; text-align: left; font-family: inherit; transition: all 0.15s; }
  .room-on { border: 1.5px solid #FDE68A; background: #FFFBEB; }
  .room-off { border: 1.5px solid #F1F5F9; background: #FAFAFA; }
  .room-label { font-size: 12px; font-weight: 700; }
  .room-label-on { color: #92400E; }
  .room-label-off { color: #64748B; }
  .room-footer { font-size: 11px; margin-top: 2px; font-weight: 500; display: flex; justify-content: space-between; }
  .room-footer-on { color: #D97706; }
  .room-footer-off { color: #94A3B8; }
  .divider { height: 1px; background: #F1F5F9; margin-top: 12px; }
  .sensors { padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 6px; }
  .sensor { display: flex; align-items: center; gap: 10px; }
  .sensor-label { flex: 1; font-size: 12px; font-weight: 600; color: #475569; }
  .sensor-state { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
  .sensor-ok { color: #16A34A; background: #F0FDF4; }
  .sensor-warn { color: #F59E0B; background: #FEF9C3; }
  .loading { padding: 40px; text-align: center; color: #94A3B8; font-size: 13px; }
</style>
</head>
<body>
<div id="root" class="card"><div class="loading">Loading home status...</div></div>
<script src="mcp-bridge.js"></script>
<script>
  const root = document.getElementById('root');
  const app = new McpApp({ name: 'giap-smarthome', version: '1.0.0' });
  let lightState = {};

  const homeSvg = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="1.75" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
  const shieldSvg = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="1.75" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
  const sunOnSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.75" stroke-linecap="round"><path d="M9 18h6M12 2v1M4.93 4.93l.7.7M2 12h1M4.93 19.07l.7-.7M21 12h1M19.07 4.93l-.7.7M19.07 19.07l-.7-.7M12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>';
  const sunOffSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="1.75" stroke-linecap="round"><path d="M9 18h6M12 2v1M4.93 4.93l.7.7M2 12h1M21 12h1M17 17A7 7 0 0 0 7 7"/></svg>';

  function sensorSvg(label) {
    const l = label.toLowerCase();
    if (l.includes('door') || l.includes('lock')) return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.75"><path d="M18 8h-1a6 6 0 0 0-12 0H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2zM10 12a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"/></svg>';
    if (l.includes('garage')) return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.75"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
    if (l.includes('temp') || l.includes('outdoor')) return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.75"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>';
    if (l.includes('leak') || l.includes('water')) return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.75"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>';
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.75"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
  }

  function render(data) {
    const rooms = data.rooms || [];
    const sensors = data.sensors || [];
    if (Object.keys(lightState).length === 0) {
      rooms.forEach(r => lightState[r.key] = r.lightOn ?? r.on ?? false);
    }
    const litCount = Object.values(lightState).filter(Boolean).length;

    let html = `<div class="header"><div class="header-left">${homeSvg}<span class="title">Home status</span></div><span class="secure">${shieldSvg}Secure</span></div>`;
    html += `<div class="meta">${litCount} light${litCount !== 1 ? 's' : ''} on</div><div class="rooms">`;

    rooms.slice(0, 4).forEach(r => {
      const on = lightState[r.key];
      const cls = on ? 'room-on' : 'room-off';
      const lblCls = on ? 'room-label-on' : 'room-label-off';
      const ftCls = on ? 'room-footer-on' : 'room-footer-off';
      html += `<button class="room ${cls}" data-key="${r.key}"><div style="margin-bottom:6px">${on ? sunOnSvg : sunOffSvg}</div><div class="room-label ${lblCls}">${r.label}</div><div class="room-footer ${ftCls}"><span>${r.temp || ''}</span><span style="font-weight:700;color:${on?'#F59E0B':'#CBD5E1'}">${on?'On':'Off'}</span></div></button>`;
    });

    html += '</div>';

    if (sensors.length > 0) {
      html += '<div class="divider"></div><div class="sensors">';
      sensors.forEach(s => {
        const ok = s.ok !== false;
        html += `<div class="sensor">${sensorSvg(s.label)}<span class="sensor-label">${s.label}</span><span class="sensor-state ${ok?'sensor-ok':'sensor-warn'}">${s.state}</span></div>`;
      });
      html += '</div>';
    }

    root.innerHTML = html;

    // Bind room toggle clicks
    root.querySelectorAll('.room').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        lightState[key] = !lightState[key];
        render(data);
      });
    });

    app.reportSize(root.offsetWidth, root.offsetHeight);
  }

  app.ontoolresult = (result) => {
    const text = result?.content?.find(c => c.type === 'text')?.text;
    if (!text) return;
    try { render(JSON.parse(text)); } catch {}
  };
  app.ontoolinput = (input) => { if (input?.arguments) render(input.arguments); };
  app.connect();
</script>
</body>
</html>
