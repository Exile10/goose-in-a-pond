# This crate is intentionally NOT in the root workspace (same pattern as
# pond-adapters-goose and pond-mcp-server). Tauri has its own dependency tree.
[workspace]

[package]
name = "pond-desktop"
version = "0.1.0"
description = "Goose In A Pond — Native Desktop App"
authors = ["Jerry Ochieng"]
edition = "2021"

[[bin]]
name = "pond-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"

# Native audio capture — same cpal version as pond-adapters-whisper
cpal = "0.15"

# HTTP client for talking to pond-server
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream", "blocking"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio playback for TTS output
rodio = { version = "0.17", default-features = false, features = ["wav", "mp3"] }

# UUID generation (for session IDs)
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
# Build without console window on Windows release builds
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
