# cargo-audit policy — every ignore below is a documented, justified exception,
# not a silenced finding. Re-evaluate on each weekly Security run and remove
# entries as soon as the owning dependency can be bumped.
#
# Triage rule: advisories fixable from THIS repo's lockfile are fixed, never
# ignored (crossbeam-epoch and quinn-proto were bumped when this file landed).

[advisories]
ignore = [
    # (RUSTSEC-2026-0187 — lopdf stack overflow — was removed here after
    # bumping lopdf to 0.42 on the goose patch branch, jarida-io/Goose PR #4.)

    # quick-xml 0.36/0.37: quadratic duplicate-attribute check (7.5) …
    "RUSTSEC-2026-0194",
    # … and unbounded namespace-declaration allocation DoS (7.5).
    # Owned by docx-rs under goose-mcp (goose submodule). BLOCKED UPSTREAM:
    # docx-rs 0.4.20 is the latest release (checked 2026-07-16) and still
    # requires quick-xml 0.36; the fix needs docx-rs to ship quick-xml >=0.41.
    # GIAP does not parse untrusted XML/DOCX through these paths.
    "RUSTSEC-2026-0195",

    # rsa: Marvin timing side-channel (5.9 medium). NO fixed release exists
    # (long-standing ecosystem advisory, pulled transitively). Not used for
    # GIAP's own crypto (pairing uses HMAC-SHA256; tokens are sha256 hashes).
    # Remove the moment the rsa crate ships a fixed version.
    "RUSTSEC-2023-0071",
]
