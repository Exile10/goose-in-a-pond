[workspace]
resolver = "2"
members = [
    "crates/pond-core",
    "crates/pond-api",
    "crates/pond-hf-cache",
    "crates/pond-infra",
    "crates/pond-infra-scheduler",
    "crates/pond-server",
    "crates/pond-adapters-llamafile",
    "crates/pond-adapters-ollama",
    "crates/pond-adapters-whisper",
    "crates/pond-adapters-piper",
    "crates/pond-adapters-face-onnx",
    "crates/pond-adapters-matter",
    "crates/pond-adapters-vision",
    "crates/pond-adapters-vision-onnx",
    "crates/pond-adapters-weather",
    "crates/pond-adapters-mcp-memory",
    # Independent agent + inference engine (no Goose dependency — future primary path)
    "crates/pond-agent",
    "crates/pond-inference",
    # Goose-dependent crates — use goose with default-features=false to avoid
    # the rmcp version conflict (code-mode feature is not enabled).
    "crates/pond-adapters-goose",
    "crates/pond-adapters-local-inference",
    "crates/pond-mcp-server",
]

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
authors = ["Jerry Anyumba <jerry@jarida.io>","Liz Wangui <liz@jarida.io>",
    "Purity Wanjiru <wanjiru@jarida.io>","Emmanuel Oyugi <oyugi@jarida.io>",
    "Africia Kerubo <africia@jarida.io>"]
license = "Apache-2.0"
repository = "https://github.com/jarida-io/goose-in-a-pond"
description = "Goose in a Pond - A modular AI assistant"

[workspace.lints.clippy]
uninlined_format_args = "allow"
string_slice = "warn"

[workspace.dependencies]
# rmcp — goose declares ^1.4; GIAP forces =1.5.0 so the submodule and
# pond-mcp-server resolve to a single rmcp. Feature list is the union.
# No GIAP workspace member uses rmcp directly.
rmcp = { version = "=1.5.0", features = ["schemars", "auth", "server", "client",
    "transport-io", "macros", "transport-child-process",
    "transport-streamable-http-client", "transport-streamable-http-client-reqwest",
    "transport-streamable-http-client-unix-socket"] }
# ── Goose sub-workspace deps ──────────────────────────────────────────────────
# Cargo resolves goose crates' `workspace = true` dependency entries against the
# outermost workspace (GIAP) when those crates are reached via path deps.
# These entries mirror goose/Cargo.toml [workspace.dependencies]. Where a GIAP
# crate needs default features goose turns off, the entry here is the union —
# extra features are additive and harmless. Where goose moved to a new MAJOR a
# pond crate is not ready for (rand, sha2, thiserror, dirs, tower-http), the
# key holds goose's version and the pond crate pins its own version directly.
agent-client-protocol-schema = { version = "1.1", default-features = false, features = ["unstable"] }
agent-client-protocol = { version = "1.0", default-features = false }
agent-client-protocol-http = { version = "1.0", default-features = false, features = ["server", "unstable_cancel_request"] }
arboard = { version = "3", default-features = false }
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
keyring = { version = "3.6.3", default-features = false, features = ["vendored"] }
rustls = { version = "0.23.31", default-features = false, features = ["aws_lc_rs", "std"] }
sha2 = { version = "0.11", default-features = false }
hmac             = "0.12"
subtle           = "2.6"
strum = { version = "0.28.0", default-features = false, features = ["derive", "std"] }
shell-words = { version = "1", default-features = false, features = ["std"] }
rayon = { version = "1.10", default-features = false }
tracing-futures = { version = "0.2.4", default-features = false, features = ["futures-03", "std", "std-future"] }
tree-sitter = { version = "0.26", default-features = false, features = ["std"] }
tree-sitter-go = { version = "0.25", default-features = false }
tree-sitter-java = { version = "0.23", default-features = false }
tree-sitter-javascript = { version = "0.25", default-features = false }
tree-sitter-kotlin-ng = { version = "1", default-features = false }
tree-sitter-python = { version = "0.25", default-features = false }
tree-sitter-ruby = { version = "0.23", default-features = false }
tree-sitter-rust = { version = "0.24", default-features = false }
tree-sitter-swift = { version = "0.7", default-features = false }
tree-sitter-typescript = { version = "0.23", default-features = false }
# llama-cpp-2 has breaking changes in patch releases; goose pins it exactly.
llama-cpp-2 = { version = "=0.1.146", default-features = false, features = ["sampler", "mtmd"] }
llama-cpp-sys-2 = { version = "=0.1.146", default-features = false }
# temporal_rs 0.1 (transitive via PCTX) enables unstable icu features without
# pinning; goose pins icu to a compatible exact version. Mirrored here.
icu_calendar = { version = "=2.1.1", default-features = false }
icu_locale = { version = "=2.1.1", default-features = false }
winapi = { version = "0.3.9", features = ["wincred", "std"] }
# zip v8 for goose; pond-server pins zip = "2" directly in its own Cargo.toml
zip = { version = "^8.0", default-features = false, features = ["deflate"] }
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2"] }
base64 = "0.22.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
croner = "2.2"
clap = { version = "4", features = ["derive"] }
dirs = { version = "6", default-features = false }
dotenvy = "0.15"
env-lock = "1.0.1"
etcetera = "0.11.0"
fs2 = "0.4"
futures = "0.3"
http = "1.1"
ignore = "0.4.25"
include_dir = "0.7.4"
indoc = "2.0"
lru = "0.18"
once_cell = "1.21"
rand = "0.10.1"
regex = "1.12"
# Test-only: generates a throwaway RSA key so the FCM relay's signing path can
# be exercised without committing a PEM (gitleaks scans full history).
rsa = { version = "0.9", features = ["pem"] }
reqwest = { version = "0.13.2", default-features = false, features = ["multipart", "form", "json","rustls"] }
schemars = { version = "1.0.2", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tera = { version = "1", default-features = false }
shellexpand = { version = "3.1", features = ["base-0", "tilde"] }
tempfile = "3"
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.49", features = [
    "rt-multi-thread", "macros", "sync", "time",
    "io-util", "io-std", "fs", "net", "signal", "process",
] }
tokio-stream = "0.1"
tokio-tungstenite = "0.26"
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.7.0", default-features = false }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
urlencoding = "2.1"
utoipa = { version = "4.1", features = ["chrono"] }
uuid = { version = "1.23", features = ["v4"] }
webbrowser = "1.0"
which = { version = "8", features = ["real-sys"] }
wiremock = "0.6"
tokio-cron-scheduler = "0.14"
serial_test = "3.2.0"
test-case = "3.3.1"
assert_cmd = "2"
predicates = "3"
url = "2.5.8"
opentelemetry = { version = "0.32", default-features = false }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics"] }
opentelemetry-http = { version = "0.32", default-features = false, features = ["internal-logs", "reqwest"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "internal-logs", "logs", "metrics", "reqwest-client", "trace"] }
opentelemetry-appender-tracing = { version = "0.32", default-features = false, features = ["experimental_span_attributes"] }
opentelemetry-stdout = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs"] }
tracing-opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
hostname = "0.4"
jsonwebtoken = "9"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate", "chrono"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ndarray = "0.16"
fastembed = { version = "=5.16.0", default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }

# Internal workspace crates
pond-core              = { path = "crates/pond-core" }
pond-api               = { path = "crates/pond-api" }
pond-hf-cache          = { path = "crates/pond-hf-cache" }
pond-infra             = { path = "crates/pond-infra" }
pond-infra-scheduler   = { path = "crates/pond-infra-scheduler" }
pond-adapters-llamafile = { path = "crates/pond-adapters-llamafile" }
pond-adapters-matter           = { path = "crates/pond-adapters-matter" }
pond-adapters-vision           = { path = "crates/pond-adapters-vision" }
pond-adapters-vision-onnx      = { path = "crates/pond-adapters-vision-onnx" }
pond-adapters-weather          = { path = "crates/pond-adapters-weather" }
pond-adapters-mcp-memory       = { path = "crates/pond-adapters-mcp-memory" }
pond-adapters-local-inference  = { path = "crates/pond-adapters-local-inference" }
pond-adapters-face-onnx        = { path = "crates/pond-adapters-face-onnx" }

# ── Release profile for Jetson / embedded deployment ─────────────────────────
[profile.release]
opt-level = "s"         # size-optimize (matches Tauri sub-crate choice)
lto = "thin"            # good optimization, faster compile than fat LTO
codegen-units = 1
strip = true
panic = "abort"

# NOTE: goose's own [patch.crates-io] (vendored v8, cudaforge) is ignored when
# building from this root; replicate entries here if its build graph ever needs
# them. The previous sacp/opentelemetry-git/temporal_rs patches are obsolete —
# goose now uses released agent-client-protocol 1.x, opentelemetry 0.32, and
# exact icu pins instead.
