# Cross.toml — cross-compilation config for GIAP (Jetson Orin Nano: ARM64 Linux, no CUDA).
# Usage: cargo install cross --locked, then
#   cross build -p pond-server --target aarch64-unknown-linux-gnu --release
# local-inference (GGUF in-process; optional cuda feature) is compiled natively on the device.

[build.env]
# RUSTFLAGS is passed through so the host-side override (a portable target-cpu such as
# cortex-a78) reaches the in-container rustc and neutralises the workspace `.cargo/config.toml`
# `target-cpu=native`, which would otherwise bake the BUILD container's CPU into the binary.
passthrough = ["SQLX_OFFLINE", "RUST_LOG", "RUSTFLAGS"]

[target.aarch64-unknown-linux-gnu]
xargo = false
pre-build = [
    # Add ARM64 architecture for cross-arch apt packages
    "dpkg --add-architecture arm64",
    """
    apt-get update --fix-missing && apt-get install -y \
      pkg-config \
      cmake \
      gcc-aarch64-linux-gnu \
      g++-aarch64-linux-gnu \
      libssl-dev:arm64 \
      libasound2-dev:arm64 \
      libdbus-1-dev:arm64
    """,
]

[patch.crates-io]
icu_calendar = "=1.5.0"
icu_provider = "=1.5.0"
icu_locid = "=1.5.0"
icu_locid_transform = "=1.5.0"
icu_collections = "=1.5.0"
icu_properties = "=1.5.1"
icu_normalizer = "=1.5.0"
writeable = "=0.5.5"
yoke = "=0.7.5"
zerovec = "=0.10.4"
