# Cross.toml — cross-compilation config for GIAP
#
# Usage (Jetson Orin Nano — ARM64 Linux, no CUDA):
#   cargo install cross --locked
#   cross build -p pond-server --target aarch64-unknown-linux-gnu --release
#
# For local-inference (GGUF in-process) on Jetson, compile natively on the device:
#   cargo build -p pond-server --features local-inference --release
#   # Add --features pond-adapters-local-inference/cuda for GPU acceleration

[build.env]
# RUSTFLAGS is passed through so the host-side override (portable target-cpu for
# the Jetson Orin Nano, e.g. cortex-a78) reaches the in-container rustc. This is
# required to neutralise the workspace `.cargo/config.toml` `[build] rustflags =
# ["-C","target-cpu=native"]`, which would otherwise bake the BUILD container's
# CPU into the binary and produce a non-portable artifact.
passthrough = ["SQLX_OFFLINE", "RUST_LOG", "RUSTFLAGS"]

[target.aarch64-unknown-linux-gnu]
xargo = false
pre-build = [
    # Add ARM64 architecture for cross-arch apt packages
    "dpkg --add-architecture arm64",
    """
    apt-get update --fix-missing && apt-get install -y \
      pkg-config \
      cmake \
      gcc-aarch64-linux-gnu \
      g++-aarch64-linux-gnu \
      libssl-dev:arm64 \
      libasound2-dev:arm64 \
      libdbus-1-dev:arm64
    """,
]

[patch.crates-io]
icu_calendar = "=1.5.0"
icu_provider = "=1.5.0"
icu_locid = "=1.5.0"
icu_locid_transform = "=1.5.0"
icu_collections = "=1.5.0"
icu_properties = "=1.5.1"
icu_normalizer = "=1.5.0"
writeable = "=0.5.5"
yoke = "=0.7.5"
zerovec = "=0.10.4"
