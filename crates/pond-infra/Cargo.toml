[package]
name = "pond-infra"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
pond-core = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
hostname = { workspace = true }
tracing = { workspace = true }
reqwest = {workspace = true}
jsonwebtoken = { workspace = true }
fastembed = { workspace = true }
# Handshake / pairing (#93): HMAC pairing proof + hashed tokens.
sha2 = "0.10"
hmac = { workspace = true }
rand = "0.8"
base64 = { workspace = true }
# Phase F2: image attachments are stored as files under the OS data dir; the
# adapter resolves that dir itself (POND_DATA_DIR override first) rather than
# having it threaded down from pond-server, mirroring model_download.rs.
dirs = { workspace = true }
subtle = { workspace = true }
once_cell = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
serde_json = { workspace = true }
rsa = { workspace = true }
# NOTE: no dev-dependency on `rand` — tests use the [dependencies] rand 0.8
# (the API `thread_rng`/`OsRng` here and rsa 0.9's rand_core 0.6 both need it);
# a second, newer rand would hand rustc two rlib candidates (E0464).
