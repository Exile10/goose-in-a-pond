[package]
name = "pond-audio-out"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The speaker-side counterpart to `pond-audio`: backend-agnostic WAV in, speaker
# out, with the barge-in and turn-generation semantics documented on `play_wav`,
# so a second TTS engine need not copy them. `pond-voice` cannot host it: it is a
# std-only leaf because `pond-desktop/src-tauri` is a workspace of its own.

[dependencies]
pond-core = { workspace = true }
pond-voice = { path = "../pond-voice" }
anyhow = { workspace = true }
tracing = { workspace = true }
# rodio is isolated to this crate — playback must not leak into every crate
# that happens to want to make a sound.
rodio = "0.19"
