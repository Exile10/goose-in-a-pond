[package]
name = "pond-audio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "pond_audio"
path = "src/lib.rs"

# The single microphone owner. Sits between `pond-voice` (pure DSP, no cpal) and
# the adapters that used to each open their own input device.
#
# Deps are deliberately minimal: cpal for the device, pond-voice for the
# primitives, tracing for diagnostics. No tokio — a cpal stream is `!Send` on
# CoreAudio, so the owner is an OS thread with a channel, not an async task.
[dependencies]
cpal = "0.15"
pond-voice = { path = "../pond-voice" }
tracing = { workspace = true }
