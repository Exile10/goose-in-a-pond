[package]
name = "pond-adapters-local-inference"
description = "In-process GGUF inference via Goose's LocalInferenceProvider (no external LLM server required)"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

# Build note: this crate compiles llama-cpp-2 + candle, so a first compile takes 5-15 min.
# Metal (macOS) activates automatically via llama-cpp-2's target_os cfg; CUDA (Jetson) needs
# `cargo build -p pond-adapters-local-inference --features cuda`.

[features]
default = []
# Enable CUDA kernel compilation for Jetson Orin Nano / NVIDIA GPUs.
cuda = ["goose/cuda"]

[dependencies]
pond-core            = { workspace = true }
pond-adapters-goose  = { path = "../pond-adapters-goose" }
goose-providers      = { path = "../../goose/crates/goose-providers", default-features = false }
goose                = { path = "../../goose/crates/goose", default-features = false,
                         features = ["local-inference", "rustls-tls"] }
anyhow               = { workspace = true }
async-trait          = { workspace = true }
tokio                = { workspace = true }
uuid                 = { workspace = true }
tracing              = { workspace = true }
serde_json           = { workspace = true }
rmcp                 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
