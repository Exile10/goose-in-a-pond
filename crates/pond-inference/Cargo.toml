[package]
name = "pond-inference"
description = "In-process GGUF inference engine for GIAP (llama.cpp, no Goose dependency)"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

# ── Build note ────────────────────────────────────────────────────────────────
# This crate compiles llama-cpp-2 (heavy C++ lib).
# First compile takes 5-15 min. Metal (macOS) activates automatically via
# llama-cpp-2's target_os cfg. CUDA (Jetson) requires --features cuda.
#
# To build:
#   cargo build -p pond-inference
#   cargo build -p pond-inference --features cuda   # Jetson

[features]
default = []
# Enable CUDA kernel compilation for Jetson Orin Nano / NVIDIA GPUs.
# Same VMM reservation problem as goose-local-inference; keep the two in step.
cuda = ["llama-cpp-2/cuda-no-vmm"]

[dependencies]
pond-core     = { workspace = true }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
async-stream  = { workspace = true }
futures       = { workspace = true }
serde         = { workspace = true, features = ["derive"] }
serde_json    = { workspace = true }
tokio         = { workspace = true, features = ["sync", "rt"] }
tracing       = { workspace = true }
uuid          = { workspace = true, features = ["v4"] }
encoding_rs   = "0.8"

# Take the workspace entry rather than restating it. It carries goose's exact pin
# AND `default-features = false`, and both matter: a literal `version = "0.1.143"`
# here unified with goose's `=0.1.146` (a caret range accepts it) while the missing
# `default-features = false` re-enabled upstream's `default = ["openmp", ...]` for
# the whole resolution unit. Resolver v2 unions features across normal deps, so
# this crate — which cannot execute at all under the Q2-05 quarantine — decided how
# ggml was threaded for the engine that does. It showed up as GGML_OPENMP:BOOL=ON
# in three of four llama-cpp-sys-2 build dirs.
[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, features = ["metal"] }

# The raw FFI, so `engine.rs` can initialise the C backend WITHOUT entering
# `LlamaBackend::init`'s process-global CAS -- which belongs to Goose. See the
# comment on `get_or_init_backend`. Workspace entry only: it carries the same
# `=0.1.146` exact pin as `llama-cpp-2`, and a skew here would link a second copy
# of the C library. It declares no features, so the resolver's union is unchanged
# (the metal/cuda features still come from `llama-cpp-2`'s own dependency on it).
[dependencies.llama-cpp-sys-2]
workspace = true
