[package]
name = "pond-adapters-qwen-tts"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
pond-core   = { workspace = true }
anyhow      = { workspace = true }
async-trait = { workspace = true }
reqwest     = { workspace = true, features = ["json", "rustls"] }
# rodio is isolated here — not added to workspace deps to avoid pulling audio
# deps into every crate that doesn't need them.
rodio       = "0.19"
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }
