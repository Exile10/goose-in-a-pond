[package]
name = "pond-adapters-audio-devices"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Finds, tests and watches the microphones and speakers (cpal) for pond-core's audio device port"

[lints]
workspace = true

# cpal is already in the tree through pond-audio and rodio; this crate only adds the policy glue.
[dependencies]
pond-core = { workspace = true }
