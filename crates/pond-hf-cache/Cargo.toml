[package]
name = "pond-hf-cache"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "pond_hf_cache"
path = "src/lib.rs"

[dependencies]
# PAI-2 P6a. This crate downloads model blobs from huggingface.co and follows
# redirects to CDN hosts by hand, so it must consult the network-mode gate like
# every other sender. The direction is inward and there is no cycle: pond-core
# depends only on pond-voice + serde/tokio/tracing and never reaches back here.
pond-core = { workspace = true }
anyhow = { workspace = true }
fs2 = { workspace = true }
reqwest = { workspace = true }
thiserror = "1.0"
tokio = { workspace = true }
url = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
fs2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
