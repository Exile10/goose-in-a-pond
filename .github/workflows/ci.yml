name: CI

# `paths-ignore` belongs to each EVENT, not to `on:` itself — at the top level
# GitHub reads it as the name of an event that does not exist and the filter
# silently does nothing.
on:
  push:
    # Trunk only. A PR branch used to match here AND on `pull_request`, so every
    # push to an open PR ran the entire matrix twice for one change. The PR event
    # is the gate that actually blocks a merge, so it is the one worth paying for.
    branches: [main, hardening]
    paths-ignore: &docs-only
      - "**/*.md"
      - "docs/**"
      - ".ai/**"
      - "LICENSE"
  pull_request:
    branches: [main, hardening]
    # Documentation cannot break a build, and this repo's guides are long and
    # edited often — each edit was spending a full Rust + frontend matrix to
    # prove that markdown still parses.
    paths-ignore: *docs-only

# One run per branch. Without this every push started a fresh full matrix and
# left the previous one running to completion against a commit nobody would
# merge; a burst of three pushes billed three complete builds to answer a
# question only the last one asked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml sets `-C target-cpu=native` for on-device (Jetson) perf.
  # On CI that flag is a SIGILL landmine: the target/ cache is shared across a
  # heterogeneous runner fleet, so proc-macros compiled with one runner's CPU
  # features crash (illegal instruction) when loaded on another. An explicitly
  # set (empty) RUSTFLAGS takes precedence over config-file rustflags, giving
  # portable codegen on CI; it also keys the rust-cache separately and changes
  # crate fingerprints, so previously-poisoned caches are rebuilt, not loaded.
  RUSTFLAGS: ""

jobs:
  # 1: Rust ─────────────────────────────────────────────────────────────
  # Checks formatting, lints, and runs the fast test suite.
  # Excludes crates that depend on the Goose submodule or native system libs
  # (pond-adapters-goose, pond-adapters-local-inference, pond-adapters-face-onnx,
  # pond-server) to keep compile time reasonable.
  rust:
    name: Rust — fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      # Reclaim ~25GB on the hosted runner before the heavy goose build, so the
      # production-binary `cargo check` + the rust-cache save step don't ENOSPC.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          df -h /

      # Clone goose directly at the fork's main branch HEAD.
      # Bypasses submodule SHA pinning. jarida-io/Goose:main is upstream main
      # (2026-07 sync) + the GIAP patch set (see docs/goose-patch-management.md).
      # NOTE: parent main's ci.yml still names giap-patches-rmcp-1.5 until this
      # branch merges — a BREAKING future sync must be staged on a side branch
      # and only fast-forwarded into fork main together with the parent-side
      # port, or older parent branches fail CI on fresh runs.
      - name: Checkout goose submodule
        run: |
          rm -rf goose
          git clone --depth=1 --branch main https://github.com/jarida-io/Goose goose

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo/registry and the build target dir keyed on Cargo.lock.
      # After the first run, unchanged crates are not recompiled.
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        # `update` first: the runner image ships a cached apt index, and when a
        # mirror supersedes a package version the stale index 404s the install
        # (this flaked both PR #188 and #189 on 2026-07-16).
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: rustup component add clippy

      - name: cargo clippy (fast crates)
        run: |
          cargo clippy \
            -p pond-voice \
            -p pond-audio \
            -p pond-core \
            -p pond-infra \
            -p pond-infra-scheduler \
            -p pond-api \
            -p pond-adapters-llamafile \
            -p pond-adapters-ollama \
            -p pond-adapters-whisper \
            -p pond-adapters-matter \
            -p pond-adapters-vision \
            -p pond-adapters-weather \
            -p pond-adapters-caldav \
            -p pond-adapters-imap \
            -p pond-adapters-mcp-memory \
            -p pond-mesh-protocol \
            -p pond-mcp-server

      # --ignored is NOT passed so the 28 live-hardware tests are skipped.
      - name: cargo test (fast crates)
        run: |
          cargo test \
            -p pond-voice \
            -p pond-audio \
            -p pond-core \
            -p pond-infra \
            -p pond-infra-scheduler \
            -p pond-api \
            -p pond-adapters-llamafile \
            -p pond-adapters-ollama \
            -p pond-adapters-whisper \
            -p pond-adapters-matter \
            -p pond-adapters-vision \
            -p pond-adapters-weather \
            -p pond-adapters-caldav \
            -p pond-adapters-imap \
            -p pond-adapters-mcp-memory \
            -p pond-mesh-protocol \
            -p pond-mcp-server

      # Gate the PRODUCTION binary's compilation (pulls the Goose submodule).
      # Without this, a path/API break in pond-server or the Goose adapter — the
      # exact failure mode that motivated CI — passes unnoticed. Slow on a cold
      # cache; rust-cache makes subsequent runs fast.
      #
      # `--all-targets` is load-bearing, not tidiness. Without a target selector
      # cargo builds lib + bins ONLY, so these crates' tests/ and examples/ were
      # compiled by nothing in this pipeline — they are excluded from the fast
      # test job by definition. `pond-server/tests/live_feature_test.rs` sat
      # broken for a whole phase because `MemoryExtractionService::run` grew a
      # `scope` parameter: production call sites were compiler-forced to update,
      # the test call sites were not, and CI was green throughout. Prefer
      # `--all-targets` over `--tests`: `--tests` rebuilds the bins in cfg(test)
      # mode, so a break inside a `#[cfg(not(test))]` block in main.rs would
      # still slip past. This covers lib + bins + tests + examples.
      - name: cargo check (production binary + its test targets — pond-server + goose adapter)
        run: cargo check -p pond-server -p pond-adapters-goose --all-targets

      # The check above doesn't pass --features mesh, but the staged sidecar
      # build always does — this catches a mesh-only break the other misses.
      - name: cargo check (production binary with mesh feature — matches the staged sidecar build)
        run: cargo check -p pond-server --features mesh --all-targets

      # The quarantined PondAgent stack (Q2-05). It is no longer in pond-server's
      # default features, so the gate above stops reaching it — and AGENTS.md's
      # promise is that the code "compiles and can be enabled when the engine is
      # production-ready". A quarantined crate whose own unit tests no longer
      # compile has quietly broken that promise, which is why this one is
      # `--all-targets` too. It moved off the fast lint/test pass because it
      # builds llama-cpp-2, which is exactly what that list is defined to exclude.
      - name: cargo check (quarantined PondAgent + its test targets — pond-agent + pond-inference)
        run: cargo check -p pond-agent -p pond-inference --all-targets

      # `cargo check --all-targets` above COMPILES pond-inference's tests and never
      # RUNS them, which for a while meant the GGUF embedder's guards were
      # decoration: `no_giap_code_calls_llama_backend_init` and
      # `the_backend_handle_is_held_strongly_and_never_freed` protect against a
      # process-wide panic when GIAP and Goose both claim the llama backend, and
      # neither could have fired here. The crate is already built by the step
      # above, so this costs linking the test binaries and nothing else; the live
      # embed test is `#[ignore]`d and needs no model.
      - name: cargo test (in-process GGUF engine + embedder — pond-inference)
        run: cargo test -p pond-inference

      # Compile-gate the ONNX vision classifier (ort is too heavy for the fast
      # lint/test pass, mirroring pond-adapters-face-onnx). Its pure decode/
      # preprocess tests run here too — they need no ONNX Runtime library.
      - name: cargo test (vision classifier — pond-adapters-vision-onnx)
        run: cargo test -p pond-adapters-vision-onnx

      # Isolated like vision-onnx above: full-feature libp2p
      # (kad+gossipsub+relay+dcutr+identify+noise+yamux) is a materially
      # heavier compile than the rest of the fast-crates list, and this
      # crate doesn't touch Goose so it doesn't belong in the production
      # binary check either.
      - name: cargo clippy (mesh transport — pond-adapters-mesh-libp2p)
        run: cargo clippy -p pond-adapters-mesh-libp2p --all-targets

      - name: cargo test (mesh transport — pond-adapters-mesh-libp2p)
        run: cargo test -p pond-adapters-mesh-libp2p

      # Isolated like mesh-libp2p above — dev-dependencies pull in the full
      # libp2p stack. Previously only type-checked as a side effect of the
      # goose-adapter check, never linted or tested.
      - name: cargo clippy (mesh inference — pond-adapters-mesh-inference)
        run: cargo clippy -p pond-adapters-mesh-inference --all-targets

      - name: cargo test (mesh inference — pond-adapters-mesh-inference)
        run: cargo test -p pond-adapters-mesh-inference

      # Previously compiled by nothing in CI at all. Its one live-network
      # test needs a real BREEZ_API_KEY and stays #[ignore]d, like the other
      # live-hardware tests in the fast job.
      - name: cargo clippy (lightning payment rail — pond-adapters-lightning)
        run: cargo clippy -p pond-adapters-lightning --all-targets

      - name: cargo test (lightning payment rail — pond-adapters-lightning)
        run: cargo test -p pond-adapters-lightning

  # 2: Frontend ─────────────────────────────────────────────────────────
  # Runs Vitest unit tests and Playwright E2E tests.
  # Playwright spins up the Vite dev server itself (no pond-server process needed —
  # all API calls are intercepted by page.route() mocks in the test files).
  matter-server:
    name: Matter controller — tsc / vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matter-server
    steps:
      - uses: actions/checkout@v7

      # 20.19 is matter.js's floor and the one server_setup.rs enforces at
      # runtime, so CI builds against the oldest Node a Pond may have rather
      # than the newest the runner offers.
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: matter-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The controller runs under tsx with no build step, so nothing else would
      # ever type-check it.
      - name: Typecheck
        run: npx tsc --noEmit

      # The cluster mappings are pure functions over recorded devices: no
      # fabric, no hardware, no network.
      - name: Vitest (unit tests)
        run: npx vitest run

  frontend:
    name: Frontend — vitest / playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pond-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pond-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest (unit tests)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright (E2E tests)
        run: npx playwright test
