name: Claude Code Review

on:
  pull_request:
    # `synchronize` is deliberately absent: every push to an open PR would buy a fresh full
    # review of largely the same diff. Re-review on demand with `@claude review` (claude.yml).
    types: [opened, ready_for_review, reopened]
    # Prose changes do not need a code review.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".ai/**"
      - "LICENSE"

# A reopen or a ready-for-review landing on top of a running review should
# replace it, not race it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts are not ready to be read. `ready_for_review` above is what starts
    # the review, so a PR opened as a draft is reviewed once, when it is
    # promoted, instead of once now and again then.
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `medium` rather than the default: low/medium report fewer, higher-confidence findings;
          # high and above widen coverage and admit uncertain ones, at markedly higher cost. Ask
          # for more on a specific PR with `@claude /code-review high`.
          prompt: '/code-review:code-review medium ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

