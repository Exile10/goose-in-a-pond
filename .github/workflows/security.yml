# Security scanning — keeps vulnerable dependencies and leaked secrets out of
# the codebase. Three independent jobs:
#
#   rust-audit  — RustSec advisory scan of Cargo.lock (known CVEs/vulns in
#                 crate dependencies). No build and no goose submodule needed:
#                 cargo-audit reads the lockfile directly.
#   npm-audit   — npm advisory scan of the pond-desktop dependency tree,
#                 failing on high/critical findings.
#   secrets     — gitleaks scan of the FULL git history for committed
#                 credentials (API keys, tokens, private keys).
#
# Runs on every PR/push to main, weekly (to catch advisories published after
# code was merged), and on demand.

name: Security

on:
  pull_request:
    branches: [main, hardening]
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 06:17 UTC — catches newly published advisories against
    # unchanged lockfiles. Odd minute avoids the top-of-hour thundering herd.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-audit:
    name: Rust — cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary — installs in seconds vs minutes for cargo install.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-audit

      # Fails the job on any vulnerability advisory affecting a lockfile.
      # (Unmaintained/unsound advisories surface as warnings, not failures.)
      #
      # Both lockfiles must be named explicitly. Bare `cargo audit` reads the
      # workspace lockfile only, and pond-desktop/src-tauri is a separate cargo
      # project — four advisories accumulated there unnoticed because of that.
      - name: cargo audit (workspace)
        run: cargo audit

      # `if: always()` for the same reason npm-audit below sets `fail-fast: false`:
      # these are two sequential steps in ONE job, so without it a finding in the
      # workspace lockfile skips the desktop audit entirely and one bad tree
      # masks the other — the exact failure this job was split to prevent.
      - name: cargo audit (desktop shell)
        if: always()
        run: cargo audit --file pond-desktop/src-tauri/Cargo.lock

  npm-audit:
    name: Frontend — npm audit (high+)
    runs-on: ubuntu-latest
    strategy:
      # Do not stop at the first failing tree — report every one in a single run.
      fail-fast: false
      matrix:
        # Every npm lockfile in the repo. Add new ones here.
        project: [pond-desktop, extensions/music]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      # `npm audit` needs only the lockfile; fail on high/critical advisories.
      - name: npm audit
        run: npm audit --audit-level=high

  osv:
    name: All lockfiles — OSV (GitHub Advisory ranges)
    runs-on: ubuntu-latest
    # Advisory, not blocking — for now, and deliberately.
    #
    # osv-scanner exits non-zero on ANY matched advisory at ANY severity, and
    # this tree provably cannot reach zero: rsa 0.9.10 (RUSTSEC-2023-0071, the
    # Marvin timing side-channel) has no fixed release at all, and neither does
    # ttf-parser 0.25.1 (RUSTSEC-2026-0192). Others — quick-xml, scc — need
    # semver-major bumps inside the goose submodule's own dependency tree,
    # which is not ours to move.
    #
    # A gate that can never go green is not a gate; it trains everyone to
    # ignore a red X, which is how the four unnoticed desktop-shell advisories
    # happened in the first place. So this job reports and does not block until
    # an `osv-scanner.toml` exists with a reviewed `[[IgnoredVulns]]` entry per
    # unfixable advisory (id + reason + expiry, matching the triage rule already
    # written down in .cargo/audit.toml). Drop this line in the same commit that
    # adds that file.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      # Why this exists alongside cargo audit.
      #
      # cargo-audit resolves against the RustSec advisory database. Dependabot
      # resolves against the GitHub Advisory Database. The two disagree on
      # affected ranges, and the GitHub ranges are sometimes wider — openssl,
      # tar, serde_with and jsonwebtoken were all open Dependabot alerts
      # against the workspace lockfile while `cargo audit` reported it clean.
      # A green cargo-audit run is not evidence that a lockfile is clean.
      #
      # osv-scanner queries OSV.dev, which aggregates BOTH databases, so it sees
      # what Dependabot sees across Cargo and npm alike. cargo-deny would NOT
      # close this gap: its advisories check reads the same RustSec database
      # cargo-audit already does.
      #
      # Lockfiles are listed explicitly rather than scanned recursively. A bare
      # recursive scan also picks up vendor/temporal_rs and
      # templates/extensions/rust — a vendored [patch] source and a standalone
      # user-extension template — whose advisories are not ours to action, and
      # that noise is what lets real findings sit unread. The cost is that a new
      # lockfile must be added here; the npm-audit matrix above has the same
      # requirement.
      #
      # The goose submodule is not checked out here, and does not need to be:
      # its dependencies reach us through the workspace lockfile, which is
      # scanned.
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --lockfile=pond-desktop/src-tauri/Cargo.lock
            --lockfile=pond-desktop/package-lock.json
            --lockfile=extensions/music/package-lock.json

  secrets:
    name: Secrets — gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so a secret committed and later "deleted" still fails.
          fetch-depth: 0
          submodules: false

      # Pinned gitleaks CLI via the official image (the gitleaks GitHub Action
      # requires an org license; the CLI does not).
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --no-banner --redact --exit-code 1
