# Advanced setup, so fork and Dependabot PRs also get the Analyze checks main requires.
# Job names must stay "Analyze (<language>)", and default setup must stay off or uploads are refused.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

# A PR cancels a superseded run: nobody will merge the tree it tested. Main does not, because
# merges land faster than a full run finishes and cancelling there would leave no main commit
# verified. A newer push to main replaces the pending run, never the running one.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: native/pondnet/go.mod
          cache-dependency-path: native/pondnet/go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
