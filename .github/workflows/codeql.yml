# Advanced setup, so fork and Dependabot PRs also get the Analyze checks main requires.
# Job names must stay "Analyze (<language>)", and default setup must stay off or uploads are refused.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

# A PR keeps cancel-in-progress: a second push makes the first run's answer about a tree nobody
# will merge. A push to main does not. Merges land in bursts every 15 to 30 minutes and a full
# run takes about an hour, so cancelling meant every main run since 2026-10-01 was cancelled
# before it finished (102 cancelled, 0 passed). Without cancellation the group still holds one
# running and one pending run, and a newer push replaces the pending one, so main is tested at
# most twice per burst and each finished run reports on a real main commit.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: native/pondnet/go.mod
          cache-dependency-path: native/pondnet/go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
