# Dependabot update PRs.
#
# Alerts were already on for this repository, but there was no config, so
# nothing ever opened a PR — 35 alerts accumulated with no update path. This
# file registers every manifest we actually build.
#
# Deliberately NOT registered:
#   - goose/            — a submodule pinned to jarida-io/Goose. Its
#                         dependencies reach us through the workspace lockfile,
#                         which is registered below. Fixes belong upstream.
#   - vendor/temporal_rs — a vendored [patch.crates-io] source.
#   - templates/extensions/rust — a standalone template for user extensions,
#                         not part of any build.
#
# When adding a new lockfile, add it here AND to the npm-audit matrix and the
# osv job in .github/workflows/security.yml.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine patch/minor churn; majors stay separate so they get
      # read properly (jsonwebtoken 9 -> 10 silently required choosing a crypto
      # backend, which a grouped PR would have buried).
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /pond-desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tauri-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /pond-desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Frontend toolchain churn is high and almost entirely devDependencies.
      npm-dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      npm-prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /extensions/music
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
