# Dependabot update PRs: registers every manifest we actually build. A new lockfile goes here
# AND in the npm-audit matrix and the osv job in .github/workflows/security.yml.
# Deliberately NOT registered: goose/ (submodule pinned to jarida-io/Goose; its deps reach us via
# the workspace lockfile, fixes belong upstream), vendor/temporal_rs, templates/extensions/rust.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine patch/minor churn; majors stay separate so they get
      # read properly (jsonwebtoken 9 -> 10 silently required choosing a crypto
      # backend, which a grouped PR would have buried).
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /pond-desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Frontend toolchain churn is high and almost entirely devDependencies.
      npm-dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      npm-prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /extensions/music
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
